[package]
name = "risk-analyzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Local deterministic Git diff risk analysis"

[dependencies]
tree-sitter = "=0.27.1"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-python = "=0.25.0"
similar = "=3.2.0"
serde_json = "=1.0.154"
serde = "=1.0.229"
libc = "=0.2.190"
quick-xml = "=0.38.3"
toml = "=0.9.8"
serde_yaml_ng = "=0.10.0"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
